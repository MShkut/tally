id: tally-budget
title: Tally Budget
version: 0.1.8
description:
  short: Privacy-first household budget tracker running on your Start9 server
  long: |
    Privacy-first household budget tracker that runs entirely on your Start9 server.
    Track income, expenses, net worth, and manage your household budget with complete data ownership.

    Features:
    - CSV transaction import from your bank
    - Budget tracking by category
    - Net worth monitoring (assets and liabilities) - removed for now
    - Encrypted backup exports with AES-256-GCM encryption
    - All data stays on your server - complete privacy

release-notes: |
  Version 0.1.8 - Encrypted Backup Support
  - Added: Password-protected backup encryption using AES-256-GCM
  - Added: Support for importing encrypted .tally backup files
  - Added: Decryption during onboarding flow for encrypted backups
  - Improved: Replaced browser alerts with in-app notifications
  - Security: Encryption password is separate from login password with clear warnings
  - Note: Encrypted backups export as .tally files, unencrypted as .json

  Version 0.1.7 - Removed Gift Management Feature
  - Removed: Gift management feature and all related components
  - Removed: Gift data storage and API endpoints
  - Cleaned: Menu items and navigation references to gifts
  - Note: Gift management will be re-implemented in a future version with improved functionality

  Version 0.1.6 - Efficiency Improvements Merged
  - Merged: Performance improvements from efficiency branch
  - Improved: Backend database query optimization
  - Improved: Frontend connection status monitoring
  - Added: Query analyzer utility for backend performance tracking

  Version 0.1.5 - Performance Optimization for Large Datasets
  - FIXED: Performance issues with large transaction datasets (1000+ transactions)
  - Added: Pagination to All Transactions view (50 items per page by default)
  - Added: Adjustable page size (25/50/100/250 items per page)
  - Added: "Select All Filtered" button for bulk operations across pages
  - Improved: Only renders visible transactions instead of all at once
  - Improved: Page load time reduced from 5+ seconds to instant with large datasets

  Version 0.1.3 - Performance and UX Improvements
  - FIXED: Bulk delete performance - now uses single backend call instead of hundreds
  - FIXED: Onboarding import now properly redirects to dashboard
  - Added: POST /api/transactions/bulk-delete endpoint for efficient batch deletions
  - Improved: Bulk delete with thousands of transactions is now instant

  Version 0.1.2 - Health Check Fix
  - FIXED: Start9 health check export format

  Version 0.1.1 - Critical Bug Fixes for Transaction Management
  - FIXED: Duplicate transaction bug - edit/delete operations now work correctly without creating duplicates
  - FIXED: Category display and filtering - categories now show correctly in transaction list
  - Added: PUT /api/transactions/:id endpoint for updating single transactions
  - Changed: Transaction updates now modify single records instead of bulk reimporting all data
  - Improved: Category handling now supports backend string format

  Version 0.1.0 - First stable transaction based released gift management still needs refinement
  - Removed: all networth items (dashboard, import, charts, management, etc) not yet able to stably implement
  - Changed: Navigation menu - now has dropdowns. Added 'your plan section'
  - Changed: settings styling
  - FIXED: household name display
  - FIXED: Login styling and logout button not working
  
  Version 0.0.26 - Debug Bulk Update with Detailed Logging
  - Added: Extensive logging in bulk update to see EXACTLY what's happening
  - Logs: First item received, userId, each update operation, row changes
  - Logs: Full error stack trace if anything fails
  - This build will show us exactly what the backend is receiving and what SQL is doing

  Version 0.0.25 - Fix Manual Price Update (Simplified Approach)
  - FIXED: Manual price updates now work correctly
  - Changed: Bulk update only sends minimal data (id, currentValue, lastUpdated)
  - Changed: Backend uses single SQL transaction for all updates (fast like Excel)
  - Removed: Complex object mapping that was causing NOT NULL errors
  - Performance: Price updates now instant with database transaction

  Version 0.0.24 - Debug Manual Price Update Issue
  - Fixed: Added extensive logging to debug NOT NULL constraint error
  - Fixed: Enhanced validation in bulk update endpoint
  - Debug: Frontend logs source asset data before sending to backend
  - Debug: Backend logs received items with full details on validation failure
  - This is a diagnostic build to identify why manually entered prices aren't saving

  Version 0.0.23 - Manual Price Updates (Removes Auto-Price Fetching)
  - CRITICAL: Removed automatic price fetching to fix severe latency issues
  - Added: Manual "Update Price" button for assets - update prices anytime you want
  - Added: Option to update price for all entries with same name at once
  - Fixed: Net worth page now loads instantly (no more 3-5 second delays)
  - Fixed: Tab switching is now instant (no more auto-backfill lag)
  - Removed: Yahoo Finance API integration (temporary - will return later optimized)
  - Performance: Dramatically improved loading times across all net worth features

  Version 0.0.21 - Simplified CAD-Only Currency
  - MAJOR: Simplified to CAD only (removed currency selector for better performance)
  - Fixed: All prices automatically converted to CAD during sync
  - Fixed: Removed slow currency sync caching that was causing delays
  - Fixed: Currency conversion uses Node.js HTTPS (more reliable)
  - Fixed: Added "Clear Price History" button to fix old incorrect price data
  - Improved: Foreign stocks (USD, etc.) converted to CAD automatically
  - Improved: Faster page loading without currency selector complexity
  - Improved: Parallel price history loading for charts (faster net worth page)
  - Note: Currency selector removed from settings (CAD hardcoded)
  - Note: Use "Clear Price History" in Settings if prices show incorrectly

  Version 0.0.20 - Currency Conversion Fixed (Node.js HTTPS)
  - Fixed: Currency conversion now uses Node.js built-in HTTPS module instead of fetch
  - Fixed: 504 Gateway Timeout resolved (fetch was unavailable in backend environment)
  - Fixed: Better error handling - falls back to native currency if conversion fails
  - Fixed: Uses expired cache as fallback if currency API is unavailable
  - Improved: Currency conversion is optional (won't block price sync if it fails)
  - Improved: 10-second timeout protection for currency API calls

  Version 0.0.19 - Backend-Driven Price Sync & Currency Conversion
  - Fixed: Syntax error (duplicate 'today' declaration) that prevented server startup
  - Fixed: All remaining datetime SQL errors across all models
  - All v0.0.18 features now working correctly

  Version 0.0.18 - Backend-Driven Price Sync & Currency Conversion (had syntax errors)
  - MAJOR: Price sync now backend-driven with smart caching (faster page loads)
  - MAJOR: Net worth page loads instantly with cached data, background refresh
  - MAJOR: Intelligent sync - only checks Yahoo Finance once per day (avoids redundant API calls)
  - MAJOR: Automatic currency conversion - all prices converted to your selected currency
  - Fixed: Currency selector now works properly (CAD, EUR, GBP, JPY, USD)
  - Fixed: VFV.TO and other foreign stocks now show correct prices in your currency
  - Fixed: Asset prices update correctly in both Overview and Manage tabs
  - Fixed: All SQLite datetime('now') errors resolved across all models
  - Fixed: Slow page loading by parallelizing price history requests
  - Improved: Backend detects stock currency from Yahoo Finance (CAD, USD, GBP, etc.)
  - Improved: Uses frankfurter.app for accurate real-time exchange rates
  - Improved: Exchange rates cached for 1 hour to minimize API calls
  - Improved: Backend stores all price history, only fetches missing dates
  - Improved: Single price sync endpoint replaces frontend API calls
  - Improved: Last sync date tracked in settings (skips sync if already done today)
  - Technical: Currency settings cached in localStorage for sync access
  - Technical: Database-driven architecture eliminates frontend delays
  - Technical: Force refresh option available for manual price updates
  - Technical: Graceful fallback if currency conversion fails

  Version 0.0.17 - Performance & Data Import Overhaul
  - MAJOR: Data import speed improved from 2+ minutes to 5-15 seconds
  - MAJOR: Fixed intermittent import failures and timeout issues
  - Fixed: Yahoo Finance historical price API (BTC, stocks, ETFs now work)
  - Fixed: SQLite binding errors with complex transaction data
  - Fixed: Enhanced data type conversion for objects, arrays, and nested values
  - Improved: Single bulk import API call instead of multiple sequential calls
  - Improved: Database transactions for net worth imports (massive speed boost)
  - Improved: Better error handling and logging for import debugging
  - Improved: Navigation after import (direct to dashboard vs full reload)
  - Improved: Automatic cleanup of old localStorage data from pre-backend version
  - Technical: Transaction model handles all data formats robustly
  - Technical: Per-transaction error handling prevents total import failures

  Version 0.0.16 - Import Data Migration Fixed
  - Fixed: Import now handles old localStorage export format
  - Fixed: Transaction import handles object fields (category, merchant, etc.)
  - Fixed: Net worth import handles string/object history fields
  - Improved: Data migration from localStorage to backend version
  - Improved: Added year selector to all calendar popups for faster date navigation
  - Improved: Date range picker now uses calendar popups instead of native inputs

  Version 0.0.10
  - Networth Dashboard test
  
  Version 0.0.9 - Complete Stability Release
  - Fixed: Menu button clicks now work reliably (z-index fix)
  - Fixed: Health check shows green (changed to script type)
  - Fixed: Login required every time (memory-only auth tokens)
  - Fixed: Import on welcome screen works (localStorage fallback)
  - Fixed: Import data authentication errors resolved
  - Improved: Burger menu spacing, scrollbar, and modal timing
  - Note: Most stable release - all known issues resolved

  Version 0.0.8 - Auth & Import Fixes (deprecated - use 0.0.9)
  - Had menu click issues

  Version 0.0.4 - CommonJS Compatibility Fix
  - Fixed: Removed import.meta usage (not compatible with CommonJS)
  - Server should now start successfully on Start9

  Version 0.0.3 - Start9 Deployment Fixes
  - Fixed: Health check script compatibility (bash → sh, curl → wget)
  - Fixed: Node.js ES module error (added CommonJS type)
  - Fixed: Script permissions in Alpine Linux
  - Container now starts successfully on Start9

  Version 0.0.2 - Critical Bug Fixes
  - Fixed: Login screen now appears correctly in Start9
  - Fixed: Data persistence after container restart
  - Added: JSON data import/export for full backup/restore
  - Fixed: Household names with special characters (& symbol)
  - Added: Manual "Save Data" button
  - Improved: Startup logging and health checks
  - Improved: File operation logging for debugging

  Version 0.0.1 - Initial working release
  - Docker container implementation with nginx + Node.js API
  - Password authentication and session management
  - Data persistence via Docker volumes
  - CSV transaction import
  - Budget tracking and net worth management
license: MIT
wrapper-repo: https://github.com/MShkut/tally
upstream-repo: https://github.com/MShkut/tally
support-site: https://github.com/MShkut/tally/issues
marketing-site: https://github.com/MShkut/tally
donation-url: null

build: ["make"]
os:
  version: ">=0.3.0"
  type: debian

assets:
  license: LICENSE
  instructions: INSTRUCTIONS.md

main:
  type: docker
  image: main
  system: false
  entrypoint: /start.sh
  args: []
  mounts:
    main: /data

health-checks: {}

config: ~

properties: ~

volumes:
  main:
    type: data

interfaces:
  main:
    name: Web Interface
    description: Main web interface for Tally Budget
    ui: true
    protocols:
      - tcp
      - http
    lan-config:
      443:
        ssl: true
        internal: 8080
    tor-config:
      port-mapping:
        80: "8080"

dependencies: {}

backup:
  create:
    type: docker
    image: compat
    system: true
    entrypoint: dup
    args:
      - duplicity
      - create
      - /mnt/backup
      - /data
    mounts:
      BACKUP: /mnt/backup
      main: /data
  restore:
    type: docker
    image: compat
    system: true
    entrypoint: dup
    args:
      - duplicity
      - restore
      - /mnt/backup
      - /data
    mounts:
      BACKUP: /mnt/backup
      main: /data

migrations:
  from: {}
  to: {}
