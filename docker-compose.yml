version: '3.8'

services:
  tally:
    image: ghcr.io/carb-frog/tally:latest
    container_name: tally-budget
    restart: unless-stopped

    ports:
      - "${TALLY_PORT:-8085}:8080"

    volumes:
      - tally-data:/data

    environment:
      - DB_PATH=/data/tally.db
      - NODE_ENV=production

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tally-data:
    name: tally-data
